<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Private preview</title>
<style>
  :root { --bg: #f5f5f3; --ink: #161616; --muted: #8a8a86; --line: #d9d9d5; --field: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --ink: #ececea; --muted: #8d8d89; --line: #2e2e2c; --field: #1b1b1b; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #gate { min-height: 100%; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  #gate form { display: flex; gap: 8px; width: min(320px, 100%); }
  #gate input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 2px; background: var(--field); color: var(--ink); }
  #gate button { font: inherit; padding: 10px 14px; border: 1px solid var(--ink); border-radius: 2px; background: var(--ink); color: var(--bg); cursor: pointer; }
  #gate button:disabled { opacity: .5; cursor: progress; }
  #gate input:focus-visible, #gate button:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  #err { position: absolute; margin-top: 52px; color: var(--muted); font-size: 13px; }
  #app[hidden], #gate[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="gate">
  <form id="f" autocomplete="off">
    <label for="pw" style="position:absolute;left:-9999px">Password</label>
    <input id="pw" type="password" placeholder="Password" autofocus>
    <button id="go" type="submit">&rarr;</button>
  </form>
  <p id="err" role="alert"></p>
</div>
<div id="app" hidden></div>
<script>
(() => {
  // served as /hirschhorn (no slash): move to /hirschhorn/ so c.bin and the media resolve inside the folder
  if (!location.pathname.endsWith('/') && !/\.[a-z0-9]+$/i.test(location.pathname))
    history.replaceState(null, '', location.pathname + '/' + location.search + location.hash)
  const SALT = Uint8Array.from(atob('5hcQaZD2Qd02YG2MBi1H7w=='), c => c.charCodeAt(0))
  const ITER = 310000
  const KEYSLOT = 'pp-key-' + '__SALT__'.slice(0, 8)
  let key = null, media = {}

  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: SALT, iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt'])
  }
  async function open(buf) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12))
  }
  async function fetchOpen(url) {
    const r = await fetch(url, { cache: url === 'c.bin' ? 'no-store' : 'force-cache' })
    if (!r.ok) throw new Error('fetch ' + url)
    return open(await r.arrayBuffer())
  }

  // media: decrypted when they come near the screen; videos play while at least 35% visible
  const urls = {}
  async function load(el) {
    const name = el.dataset.media
    if (!name || el.dataset.loaded) return
    el.dataset.loaded = '1'
    const m = media[name]
    if (!m) return
    try {
      if (!urls[name]) urls[name] = URL.createObjectURL(new Blob([await fetchOpen(m.file)], { type: m.type }))
      if (el.tagName === 'VIDEO') {
        el.src = urls[name]
        el.muted = true; el.playsInline = true
        if (el.dataset.visible === '1') el.play().catch(() => {})
      } else if (el.tagName === 'IMG') {
        el.src = urls[name]
      } else {
        el.style.backgroundImage = 'url(' + urls[name] + ')'
      }
      el.classList.add('is-loaded')
    } catch (e) { el.dataset.loaded = ''; console.error(e) }
  }
  function posters(root) {
    root.querySelectorAll('video[data-poster]').forEach(async v => {
      const m = media[v.dataset.poster]; if (!m) return
      try {
        if (!urls[v.dataset.poster]) urls[v.dataset.poster] = URL.createObjectURL(new Blob([await fetchOpen(m.file)], { type: m.type }))
        v.poster = urls[v.dataset.poster]
      } catch (e) { console.error(e) }
    })
  }
  function wire(root) {
    const near = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { load(e.target); near.unobserve(e.target) } }),
      { rootMargin: '900px 0px' })
    const seen = new IntersectionObserver(es => es.forEach(e => {
      const v = e.target
      v.dataset.visible = e.isIntersecting ? '1' : '0'
      if (v.tagName !== 'VIDEO' || !v.src) return
      const group = v.dataset.sync ? [...root.querySelectorAll('video[data-sync="' + v.dataset.sync + '"]')] : [v]
      if (e.isIntersecting) {
        if (v.dataset.sync) group.forEach(g => { g.currentTime = 0; g.play().catch(() => {}) })
        else v.play().catch(() => {})
      } else group.forEach(g => g.pause())
    }), { threshold: 0.35 })
    root.querySelectorAll('[data-media]').forEach(el => { near.observe(el); if (el.tagName === 'VIDEO') seen.observe(el) })
    posters(root)
    root.querySelectorAll('video').forEach(v => v.addEventListener('loadeddata', () => {
      if (v.dataset.visible === '1') v.play().catch(() => {})
    }))
  }

  async function unlock(k) {
    key = k
    const data = JSON.parse(new TextDecoder().decode(await fetchOpen('c.bin')))
    media = data.media
    const app = document.getElementById('app')
    app.innerHTML = data.html
    const t = app.querySelector('[data-title]')
    if (t) document.title = t.dataset.title
    document.getElementById('gate').hidden = true
    app.hidden = false
    wire(app)
    // a picture opened large on click; a click or Escape closes it
    app.addEventListener('click', ev => {
      const el = ev.target.closest('img')
      if (!el || !el.src || el.closest('.lb')) return
      const lb = document.createElement('div')
      lb.className = 'lb'
      const big = el.cloneNode()
      if (big.tagName === 'VIDEO') { big.muted = true; big.loop = true; big.playsInline = true; big.autoplay = true; big.currentTime = el.currentTime }
      lb.appendChild(big)
      const close = () => { lb.remove(); document.removeEventListener('keydown', esc) }
      const esc = e => { if (e.key === 'Escape') close() }
      lb.addEventListener('click', close)
      document.addEventListener('keydown', esc)
      app.appendChild(lb)
      if (big.tagName === 'VIDEO') big.play().catch(() => {})
    })
    if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView() }
  }

  async function remembered() {
    try {
      const raw = sessionStorage.getItem(KEYSLOT)
      if (!raw) return false
      const k = await crypto.subtle.importKey('raw', Uint8Array.from(atob(raw), c => c.charCodeAt(0)), 'AES-GCM', true, ['decrypt'])
      await unlock(k)
      return true
    } catch (e) { return false }
  }

  const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err')
  f.addEventListener('submit', async ev => {
    ev.preventDefault()
    err.textContent = ''; go.disabled = true; go.textContent = '...'
    try {
      const k = await derive(pw.value)
      await unlock(k)
      try { sessionStorage.setItem(KEYSLOT, btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', k))))) } catch (e) {}
    } catch (e) {
      err.textContent = 'Wrong password.'
      go.disabled = false; go.textContent = '\u2192'; pw.select()
    }
  })
  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'This browser cannot open the page. Please use a current Chrome, Safari, Firefox or Edge.'
    go.disabled = true
  } else remembered()
})()
</script>
</body>
</html>
